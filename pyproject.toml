[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enchat"
version = "0.1.0"
dependencies = [
    "textual",
    "websockets",
    "cryptography"
]

[project.scripts]
enchat = "enchat.__main__:main"

[tool.setuptools.packages.find]
include = ["enchat*"]
